name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing draft release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and smoke-test the Windows executable
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload and publish the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag.' }
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft
          if ($LASTEXITCODE -or $draft -ne 'true') { throw 'An existing draft release is required.' }
          Rename-Item -LiteralPath dist/TuYi.exe -NewName TuYi-Windows-x64.exe
          gh release upload $env:RELEASE_TAG dist/TuYi-Windows-x64.exe
          if ($LASTEXITCODE) { throw 'Uploading the Windows executable failed.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE) { throw 'Publishing the release failed.' }
