name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing draft release
        required: true
        type: string
      release_id:
        description: GitHub ID of the draft release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and smoke-test the Windows executable
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload and publish the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag.' }
          if ($env:RELEASE_ID -notmatch '^\d+$') { throw 'Invalid release ID.' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $url = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          $release = Invoke-RestMethod $url -Headers $headers
          if (!$release.draft -or $release.tag_name -ne $env:RELEASE_TAG) {
            throw 'The release must be a draft with the requested tag.'
          }
          $file = Get-Item -LiteralPath dist/TuYi.exe
          $uploadUrl = ($release.upload_url -replace '\{.*$', '') + '?name=TuYi-Windows-x64.exe'
          $asset = Invoke-RestMethod $uploadUrl -Method Post -Headers $headers -InFile $file.FullName -ContentType 'application/octet-stream'
          if ($asset.state -ne 'uploaded' -or $asset.size -ne $file.Length) {
            throw 'Uploaded asset is incomplete.'
          }
          $published = Invoke-RestMethod $url -Method Patch -Headers $headers -ContentType 'application/json' -Body '{"draft":false,"make_latest":"true"}'
          if ($published.draft) { throw 'Publishing the release failed.' }
